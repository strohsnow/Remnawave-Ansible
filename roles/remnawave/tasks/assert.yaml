---
- name: Assert remnawave_base_domain
  ansible.builtin.assert:
    that: remnawave_base_domain | length > 0
    fail_msg: "remnawave_base_domain is required"

- name: Assert remnawave_postgres_password
  ansible.builtin.assert:
    that: remnawave_postgres_password | length > 0
    fail_msg: "remnawave_postgres_password is required"

- name: Assert remnawave_jwt_auth_secret
  ansible.builtin.assert:
    that: remnawave_jwt_auth_secret | length > 0
    fail_msg: "remnawave_jwt_auth_secret is required"

- name: Assert remnawave_jwt_api_tokens_secret
  ansible.builtin.assert:
    that: remnawave_jwt_api_tokens_secret | length > 0
    fail_msg: "remnawave_jwt_api_tokens_secret is required"

- name: Assert remnawave_metrics_pass
  ansible.builtin.assert:
    that: remnawave_metrics_pass | length > 0
    fail_msg: "remnawave_metrics_pass is required"

- name: Assert remnawave_telegram_bot_token
  ansible.builtin.assert:
    that: remnawave_telegram_bot_token | length > 0
    fail_msg: "remnawave_telegram_bot_token is required when remnawave_telegram_notifications_enabled is true"
