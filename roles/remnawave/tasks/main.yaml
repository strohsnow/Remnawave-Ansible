---
- name: Assert required variables
  ansible.builtin.import_tasks: assert.yaml

- name: Create remnawave directory
  ansible.builtin.file:
    path: "{{ remnawave_path }}"
    owner: root
    group: root
    mode: "0750"
    state: directory

- name: Create compose file
  ansible.builtin.template:
    src: docker-compose.yaml.j2
    dest: "{{ remnawave_path }}/docker-compose.yaml"
    owner: root
    group: root
    mode: "0640"

- name: Create env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ remnawave_path }}/.env"
    owner: root
    group: root
    mode: "0600"
  register: remnawave_env

- name: Deploy Remnawave
  community.docker.docker_compose_v2:
    project_src: "{{ remnawave_path }}"
    remove_orphans: true
    wait: true
    recreate: "{{ 'always' if remnawave_env is changed else 'auto' }}"
