---
remnawave_path: /opt/remnawave

remnawave_backend_tag: latest

remnawave_backend_app_port: 3000

remnawave_api_instances: 1

remnawave_base_domain: ""
remnawave_dash_domain: dash.{{ remnawave_base_domain }}
remnawave_sub_page_domain: sub.{{ remnawave_base_domain }}

remnawave_postgres_host: remnawave-db
remnawave_postgres_db: postgres
remnawave_postgres_user: postgres
remnawave_postgres_password: ""

remnawave_redis_host: remnawave-redis
remnawave_redis_socket: valkey.sock

remnawave_jwt_auth_secret: ""
remnawave_jwt_api_tokens_secret: ""

remnawave_metrics_port: 3001
remnawave_metrics_user: admin
remnawave_metrics_pass: ""

remnawave_telegram_notifications_enabled: "false"
remnawave_telegram_bot_token: ""
remnawave_telegram_notify_all: ""
remnawave_telegram_notify_users: "{{ remnawave_telegram_notify_all }}"
remnawave_telegram_notify_nodes: "{{ remnawave_telegram_notify_all }}"
remnawave_telegram_notify_crm: "{{ remnawave_telegram_notify_all }}"
remnawave_telegram_notify_service: "{{ remnawave_telegram_notify_all }}"
remnawave_telegram_notify_tblocker: "{{ remnawave_telegram_notify_all }}"

remnawave_expiration_notifications_enabled: "true"
remnawave_expiration_notifications: "[-72, -48, -24, 24]"

remnawave_additional_services: ""
