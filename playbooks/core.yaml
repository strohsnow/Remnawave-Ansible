---
- name: Harden OS
  hosts: all
  remote_user: "{{ default_user }}"
  become: true
  roles:
    - devsec.hardening.os_hardening
  vars:
    sysctl_overwrite:
      net.ipv4.ip_forward: 1
      net.core.default_qdisc: fq
      net.ipv4.tcp_congestion_control: bbr
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv6.conf.default.disable_ipv6: 1
  tags:
    - hardening
    - os_hardening

- name: Harden SSH
  hosts: all
  remote_user: "{{ default_user }}"
  become: true
  roles:
    - devsec.hardening.ssh_hardening
  tags:
    - hardening
    - ssh_hardening

- name: Install Docker
  hosts: all
  remote_user: "{{ default_user }}"
  become: true
  roles:
    - geerlingguy.docker
  tags:
    - docker

- name: Configure firewall
  hosts: all
  remote_user: "{{ default_user }}"
  become: true
  roles:
    - geerlingguy.firewall
  handlers:
    - name: Restart Docker after firewall flush
      ansible.builtin.systemd_service:
        name: docker
        state: restarted
      listen: restart firewall
  tags:
    - firewall
